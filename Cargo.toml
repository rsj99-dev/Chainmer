[package]
name = "orthochain"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
authors = ["Shijie Ren"]
description = "Dual-track protein candidate retrieval with positional seed chaining and database-calibrated scoring"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/orthochain"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "BENCHMARK.md", "LICENSE", "MANIFEST.tsv"]
keywords = ["bioinformatics", "protein", "ortholog", "seed", "sequence"]
categories = ["science", "command-line-utilities"]

[lib]
name = "orthochain"
path = "src/lib.rs"

[[bin]]
name = "orthochain"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
